name: Keep Alive Workflows

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday 06:00 UTC (weekly)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "keepalive: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive workflow active"
          git push

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import os
          import requests
          import sys
          from datetime import datetime

          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not bot_token or not chat_id:
              print("⚠️ TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID belum di-set, notifikasi dilewati.")
              sys.exit(0)

          now = datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')
          message = (
              f"✅ <b>Keep Alive Workflow Berjalan</b>\n\n"
              f"Workflow keepalive berhasil dijalankan untuk menjaga GitHub Actions tetap aktif.\n\n"
              f"⏰ Waktu: {now}\n"
              f"🔄 Scheduled workflows (manga_cron, manga_trending_cron, telegram_poller) tetap aktif."
          )

          try:
              resp = requests.post(
                  f"https://api.telegram.org/bot{bot_token}/sendMessage",
                  data={
                      "chat_id": chat_id,
                      "text": message,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True,
                  },
                  timeout=15,
              )
              if resp.status_code == 200:
                  print("✅ Notifikasi Telegram terkirim.")
              else:
                  print(f"⚠️ Gagal kirim notifikasi Telegram: {resp.status_code} {resp.text}")
          except Exception as e:
              print(f"⚠️ Error saat kirim notifikasi Telegram: {e}")
          EOF
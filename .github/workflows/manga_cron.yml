name: Manga Reader Auto Sync Cron

on:
  schedule:
    # Berjalan otomatis setiap 3 jam sekali (pada menit ke-0)
    - cron: '0 */3 * * *'
  # Memungkinkan pemicuan manual langsung dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  sync-manga:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Web Cron Sync Request
        env:
          CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          echo "Memanggil endpoint cron sync di: $SITE_URL/cron_update.php"

          # Mengirim HTTP request dengan User-Agent browser asli untuk menghindari pemblokiran sederhana
          RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            "$SITE_URL/cron_update.php?key=$CRON_SECRET_KEY")

          echo "Hasil Tanggapan Server:"
          echo "$RESPONSE"
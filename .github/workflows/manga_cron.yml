name: Manga Reader Auto Sync Cron

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync-manga:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cloudscraper
        run: pip install cloudscraper

      - name: Run Web Cron Sync Request (bypass JS challenge InfinityFree)
        env:
          CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python3 - <<'EOF'
          import os
          import sys
          import cloudscraper

          site_url = os.environ["SITE_URL"].rstrip("/")
          key = os.environ["CRON_SECRET_KEY"]

          scraper = cloudscraper.create_scraper()

          try:
              resp = scraper.get(
                  f"{site_url}/cron_update.php",
                  params={"key": key},
                  timeout=180,
              )
          except Exception as e:
              print(f"Request gagal: {e}")
              sys.exit(1)

          print("HTTP Status:", resp.status_code)
          print("Hasil Tanggapan Server:")
          print(resp.text)

          if resp.status_code != 200:
              sys.exit(1)
          EOF
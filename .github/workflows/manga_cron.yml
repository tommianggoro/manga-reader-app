name: Manga Reader Auto Sync Cron

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync-manga:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium

      - name: Run Web Cron Sync Request (bypass JS challenge InfinityFree via headless browser)
        env:
          CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python3 - <<'EOF'
          import os
          import sys
          from playwright.sync_api import sync_playwright

          site_url = os.environ["SITE_URL"].rstrip("/")
          key = os.environ["CRON_SECRET_KEY"]
          target_url = f"{site_url}/cron_update.php?key={key}"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
              )

              try:
                  # Kunjungan pertama: memicu & menjalankan JS challenge (aes.js),
                  # browser otomatis mengikuti redirect location.href yang di-set skrip.
                  page.goto(target_url, wait_until="networkidle", timeout=120000)

                  # Cron sync bisa berjalan lama (loop semua manga), tunggu sampai
                  # response body benar-benar berisi hasil JSON dari cron_update.php.
                  page.wait_for_timeout(3000)

                  body_text = page.inner_text("body")

                  # Kalau masih halaman challenge (bukan JSON), coba kunjungi ulang sekali
                  # -- cookie __test dari kunjungan pertama seharusnya sudah membuat
                  # kunjungan kedua lolos langsung ke cron_update.php.
                  if body_text.strip().startswith("<") or "aes.js" in body_text:
                      page.goto(target_url, wait_until="networkidle", timeout=120000)
                      page.wait_for_timeout(3000)
                      body_text = page.inner_text("body")

                  print("Hasil Tanggapan Server:")
                  print(body_text)

                  if body_text.strip().startswith("{") or '"success"' in body_text:
                      print("\n✅ Cron sync berhasil dijalankan.")
                  else:
                      print("\n⚠️ Respons tidak terlihat seperti JSON, mohon cek manual.")
                      sys.exit(1)

              finally:
                  browser.close()
          EOF
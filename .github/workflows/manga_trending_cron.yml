name: Manga Reader Trending Sync Cron

on:
  schedule:
    - cron: '0 4 * * *'   # 1x/hari, sebelum manga_cron.yml (jam 05:00) supaya tidak tabrakan resource
  workflow_dispatch:

jobs:
  sync-trending:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Trending Cache Refresh & Notify Telegram
        env:
          CRON_SECRET_KEY: ${{ secrets.CRON_SECRET_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import os
          import sys
          import json
          import requests
          from playwright.sync_api import sync_playwright

          site_url = os.environ["SITE_URL"].rstrip("/")
          key = os.environ["CRON_SECRET_KEY"]
          target_url = f"{site_url}/cron_trending.php?key={key}"

          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          def send_telegram(text: str):
              if not bot_token or not chat_id:
                  print("⚠️ TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID belum di-set, notifikasi dilewati.")
                  return
              try:
                  resp = requests.post(
                      f"https://api.telegram.org/bot{bot_token}/sendMessage",
                      data={
                          "chat_id": chat_id,
                          "text": text,
                          "parse_mode": "HTML",
                          "disable_web_page_preview": True,
                      },
                      timeout=15,
                  )
                  if resp.status_code != 200:
                      print(f"⚠️ Gagal kirim notifikasi Telegram: {resp.status_code} {resp.text}")
              except Exception as e:
                  print(f"⚠️ Error saat kirim notifikasi Telegram: {e}")

          # ==== Jalankan sync via headless browser (bypass JS challenge InfinityFree) ====
          body_text = None
          fetch_error = None

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  page = browser.new_page(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
                  )
                  try:
                      page.goto(target_url, wait_until="networkidle", timeout=120000)
                      page.wait_for_timeout(3000)
                      body_text = page.inner_text("body")

                      if body_text.strip().startswith("<") or "aes.js" in body_text:
                          page.goto(target_url, wait_until="networkidle", timeout=120000)
                          page.wait_for_timeout(3000)
                          body_text = page.inner_text("body")
                  finally:
                      browser.close()
          except Exception as e:
              fetch_error = str(e)

          print("Hasil Tanggapan Server:")
          print(body_text)

          # ==== Kalau request-nya sendiri gagal total (bukan error dari PHP) ====
          if fetch_error or not body_text or not body_text.strip().startswith("{"):
              msg = (
                  "🚨 <b>Manga Trending Sync GAGAL</b>\n\n"
                  f"Request ke server tidak menghasilkan respons JSON yang valid.\n"
                  f"Kemungkinan JS challenge InfinityFree berubah atau server down.\n\n"
                  f"<b>Error:</b> {fetch_error or 'Response bukan JSON (kemungkinan masih halaman challenge)'}"
              )
              send_telegram(msg)
              sys.exit(1)

          # ==== Parse hasil JSON dari cron_trending.php ====
          try:
              data = json.loads(body_text)
          except json.JSONDecodeError as e:
              send_telegram(f"🚨 <b>Manga Trending Sync GAGAL</b>\n\nGagal parse JSON respons: {e}")
              sys.exit(1)

          if not data.get("success"):
              send_telegram(f"🚨 <b>Manga Trending Sync GAGAL</b>\n\n{data.get('error', 'Unknown error')}")
              sys.exit(1)

          total_saved = data.get("total_saved", 0)
          results = data.get("results", {})

          success_sources = {k: v for k, v in results.items() if v.get("status") == "success"}
          failed_sources = {k: v for k, v in results.items() if v.get("status") == "error"}

          # ==== Bangun pesan notifikasi ====
          message_parts = []

          if success_sources:
              lines = "\n".join(
                  f"• <b>{k}</b>: {v.get('count', 0)} manga trending"
                  for k, v in success_sources.items()
              )
              message_parts.append(
                  f"🔥 <b>Trending Cache Diperbarui!</b>\n\n{lines}\n\n"
                  f"Total: {total_saved} manga trending dari {len(success_sources)} sumber."
              )

          if failed_sources:
              lines = "\n".join(
                  f"• <b>{k}</b>: {v.get('error', 'Unknown error')}"
                  for k, v in failed_sources.items()
              )
              message_parts.append(f"⚠️ <b>Sumber Gagal Diambil Trending-nya</b>\n\n{lines}")

          if message_parts:
              send_telegram("\n\n".join(message_parts))
              print("✅ Notifikasi Telegram terkirim.")
          else:
              print("✅ Sync sukses, tidak ada sumber yang diproses. Notifikasi dilewati.")

          if failed_sources and not success_sources:
              # Semua sumber gagal total -> tandai job gagal di GitHub Actions
              sys.exit(1)
          EOF